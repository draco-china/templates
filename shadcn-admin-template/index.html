<!doctype html>
<html lang="en-US" data-mode="system">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="color-scheme" content="light dark">
		<meta
			name="theme-color"
			content="#FFFFFF"
			media="(prefers-color-scheme: light)"
		>
		<meta
			name="theme-color"
			content="#000000"
			media="(prefers-color-scheme: dark)"
		>

		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<link rel="icon" href="/favicon.ico" sizes="48x48">
		<link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">

		<!-- Primary Meta Tags -->
		<title>Shadcn Admin</title>
		<meta name="title" content="Shadcn Admin">
		<meta
			name="description"
			content="Admin Dashboard UI built with Shadcn and Vite."
		>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website">
		<meta property="og:url" content="">
		<meta property="og:title" content="Shadcn Admin">
		<meta
			property="og:description"
			content="Admin Dashboard UI built with Shadcn and Vite."
		>
		<meta property="og:image" content="/images/shadcn-admin.png">

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:url" content="">
		<meta name="twitter:title" content="Shadcn Admin">
		<meta
			name="twitter:description"
			content="Admin Dashboard UI built with Shadcn and Vite."
		>
		<meta name="twitter:image" content="/images/shadcn-admin.png">

		<script src="/scripts/theme-init.js"></script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
