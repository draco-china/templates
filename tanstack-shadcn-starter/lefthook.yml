pre-commit:
  jobs:
    - name: lint
      run: bun x ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - name: typecheck
      run: bun run tsc
      glob:
        - "**/*.ts"
        - "**/*.tsx"
